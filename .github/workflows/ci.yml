name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  tofu-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/tofu/modules/pr-ephemeral
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@000eeb8522f0572907c393e8151076c205fdba1b # v1.0.6
        with:
          tofu_version: 1.10.7
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -lockfile=readonly
      - run: tofu validate
      - run: tofu test
